<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="PYK2 cartoon">
  <title>PYK2 — the immunomechanical checkpoint, as a cartoon</title>
  <rect width="120" height="120" fill="#ECEAF6"/>
  <!-- floor shadow -->
  <ellipse cx="58" cy="104" rx="30" ry="5" fill="#2E2A6B" opacity=".12"/>
  <!-- spring antenna: the force sensor -->
  <path d="M58 34 q-7 -3 0 -6 q7 -3 0 -6 q-7 -3 0 -6 q7 -3 0 -6" fill="none" stroke="#2E2A6B" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="58" cy="9" r="5" fill="#A5601A"/>
  <circle cx="56.5" cy="7.5" r="1.6" fill="#fff" opacity=".7"/>
  <!-- C-lobe (big body) -->
  <path d="M26 72 C26 52 40 44 58 44 C78 44 92 54 92 74 C92 92 78 101 58 101 C38 101 26 92 26 72 Z" fill="#E98AA0" stroke="#2E2A6B" stroke-width="2.6"/>
  <!-- N-lobe (small top lobe) -->
  <path d="M38 50 C38 38 47 32 58 32 C70 32 78 39 78 50 C70 46 47 46 38 50 Z" fill="#F4B3C2" stroke="#2E2A6B" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- light edge -->
  <path d="M34 66 C36 56 44 51 54 50" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <!-- face -->
  <circle cx="48" cy="70" r="4.2" fill="#2E2A6B"/>
  <circle cx="68" cy="70" r="4.2" fill="#2E2A6B"/>
  <circle cx="49.4" cy="68.6" r="1.4" fill="#fff"/>
  <circle cx="69.4" cy="68.6" r="1.4" fill="#fff"/>
  <ellipse cx="41" cy="79" rx="4.5" ry="2.6" fill="#B8405C" opacity=".35"/>
  <ellipse cx="75" cy="79" rx="4.5" ry="2.6" fill="#B8405C" opacity=".35"/>
  <path d="M51 80 q7 7 14 0" fill="none" stroke="#2E2A6B" stroke-width="2.6" stroke-linecap="round"/>
  <!-- waving arm -->
  <path d="M90 70 q10 -6 12 -16" fill="none" stroke="#2E2A6B" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="102" cy="52" r="4" fill="#E98AA0" stroke="#2E2A6B" stroke-width="2.4"/>
  <!-- feet -->
  <ellipse cx="46" cy="101" rx="7" ry="3.6" fill="#2E2A6B"/>
  <ellipse cx="70" cy="101" rx="7" ry="3.6" fill="#2E2A6B"/>
  <!-- question bubble: the next member -->
  <circle cx="94" cy="24" r="14" fill="#fff" stroke="#A5601A" stroke-width="2.4"/>
  <path d="M88.5 37 l-4 6 l8 -3" fill="#fff" stroke="#A5601A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M89.5 20 q0 -6 5 -6 q5.5 0 5.5 5 q0 3.5 -4 5 q-1.5 0.6 -1.5 3" fill="none" stroke="#A5601A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="94.5" cy="32" r="1.9" fill="#A5601A"/>
</svg>
